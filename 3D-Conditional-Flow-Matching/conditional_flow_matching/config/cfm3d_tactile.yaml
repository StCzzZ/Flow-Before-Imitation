defaults:
  - task: adroit_hammer

name: train_cfm3

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

horizon: 4
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True
use_contact_forces: True

policy:
  _target_: conditional_flow_matching.policy.cfm3d.CFM3D
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  

  
  # encoder_type: "CFM3D"  # can be CFM3D, Fused or Pointnet-Fused
  # Modified
  encoder_type: "CFM3D"  # can be CFM3D, Fused or Pointnet-Fused or Pointnet-Large
  flow_matching_embed_dim: 192  # can be 128(no tactile) or 192(with tactile), 128 for Fused, 128 for Pointnet-Fused, 256+64 = 320 for Pointnet-Large


  down_dims:
  - 512
  - 1024
  - 2048
  crop_shape:
  - 80
  - 80
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}


  flow_matcher: 
    _target_: conditional_flow_matching.torchcfm.conditional_flow_matching.ConditionalFlowMatcher
    sigma: 0.0  # the same as https://github.com/atong01/conditional-flow-matching/blob/main/examples/images/conditional_mnist.ipynb
  
  prediction_type: "conditional_flow_matching"

  ode_method: "euler"  # can be "euler" or "dopri5" or else, see torchdiffeq.odeint()
  inference_step: 1   # the inference step is only useful when ode_method is "euler"
  atol: 0.01  # the expected tolerance for the solution when method = 'dopri5'
  rtol: 0.01  # the same as above

  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  use_pc_color: True
  pointnet_type: "pointnet"
  use_contact_forces: ${use_contact_forces}



  pointcloud_encoder_cfg:
    in_channels: 6
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false


ema:
  _target_: conditional_flow_matching.model.conditional_unet.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 16
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 16
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4  # changed from 1.0e-4 to 3.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  mode: "original"  # can be "original", "reflow", or "distill"
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 25
  num_epochs: 150
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 20
  checkpoint_every: 20
  save_interval_every: 150
  val_every: 20
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${training.seed}
  project: cfm
  resume: true
  tags:
  - cfm

checkpoint:
  # save_ckpt: False # if True, save checkpoint every checkpoint_every
  save_ckpt: False # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: ./cfm_isaac/3D-Conditional-Flow-Matching/data/outputs_cfm/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ./cfm_isaac/3D-Conditional-Flow-Matching/data/outputs_cfm/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: ./cfm_isaac/3D-Conditional-Flow-Matching/data/outputs_cfm/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
